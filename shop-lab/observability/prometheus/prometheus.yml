global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]

  # The custom Micrometer counters and timer live in the applications. The
  # Collector target above supplies agent/Collector telemetry; these targets
  # supply the lab's business throughput and processing-latency metrics.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]

  - job_name: logistic-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [logistic-service:8080]
