name: shop-lab

# ---------------------------------------------------------------------------
# shop-lab :: Phase 1 (messaging infrastructure)
#   - kafka        : single broker in KRaft mode (no Zookeeper)
#   - kafka-init   : creates topic order.created.v1 idempotently, then exits
#   - kafka-ui     : web UI to inspect topics / consumer groups / messages
# Later phases append: prometheus, kafka-exporter, grafana.
# ---------------------------------------------------------------------------

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: shop-lab-kafka
    hostname: kafka
    # WSL2 shuts down the VM (and dockerd) when idle; unless-stopped lets the
    # broker recover automatically when the daemon comes back.
    restart: unless-stopped
    ports:
      # host -> container. External clients use ${KAFKA_HOST_PORT}; inside the
      # network services use kafka:29092.
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      # --- KRaft: this node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- listeners ---
      # INTERNAL (29092) for in-network services, HOST (9092) for the host,
      # CONTROLLER (29093) for the KRaft quorum.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://${KAFKA_EXTERNAL_BOOTSTRAP}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- single-node replication settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - shop-lab-network

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: shop-lab-kafka-init
    # One-shot job: must NOT restart after it finishes successfully.
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Creating topic ${TOPIC_ORDER_CREATED} (partitions=${TOPIC_PARTITIONS}, rf=${TOPIC_REPLICATION_FACTOR})..."
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic ${TOPIC_ORDER_CREATED} \
          --partitions ${TOPIC_PARTITIONS} \
          --replication-factor ${TOPIC_REPLICATION_FACTOR}
        echo "Current topics:"
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - shop-lab-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shop-lab-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: shop-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - shop-lab-network

  order-service:
    build: ./order-service
    image: shop-lab/order-service:0.1.0
    container_name: shop-lab-order-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_ORDER_CREATED: ${TOPIC_ORDER_CREATED}
      JAVA_TOOL_OPTIONS: -javaagent:/app/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_GRPC_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - ./observability/agent/opentelemetry-javaagent.jar:/app/otel/opentelemetry-javaagent.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - shop-lab-network

  logistic-service:
    build: ./logistic-service
    image: shop-lab/logistic-service:0.1.0
    container_name: shop-lab-logistic-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${LOGISTIC_SERVICE_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_ORDER_CREATED: ${TOPIC_ORDER_CREATED}
      RATE_LIMIT_PERMITS: ${RATE_LIMIT_PERMITS}
      JAVA_TOOL_OPTIONS: -javaagent:/app/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: logistic-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_GRPC_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - ./observability/agent/opentelemetry-javaagent.jar:/app/otel/opentelemetry-javaagent.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - shop-lab-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: shop-lab-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    depends_on:
      tempo:
        condition: service_started
    networks:
      - shop-lab-network

  tempo:
    image: grafana/tempo:2.7.2
    container_name: shop-lab-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "${TEMPO_HTTP_PORT}:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - shop-lab-network

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: shop-lab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
      kafka-exporter:
        condition: service_started
    networks:
      - shop-lab-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: shop-lab-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --group.filter=^logistic-service$
      - --topic.filter=^order.created.v1$
    expose:
      - "9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shop-lab-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: shop-lab-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - shop-lab-network

networks:
  shop-lab-network:
    driver: bridge
    name: shop-lab-network

volumes:
  kafka-data:
  tempo-data:
  prometheus-data:
  grafana-data:
